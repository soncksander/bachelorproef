services:
  database_sander:
    image: pgvector/pgvector:pg18
    container_name: database_sander
    volumes:
      - database_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    env_file:
      - .env
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  database_data:
    name: database_data
